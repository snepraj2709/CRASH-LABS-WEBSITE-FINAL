<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRASH Lab | Centre for Responsible Autonomous Systems in Healthcare</title>
    <link rel="icon" type="image/svg+xml" href="/logo-white.svg" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="CRASH Lab (Centre for Responsible Autonomous Systems in Healthcare) at Ashoka University. Building ethical, equitable AI for Indian healthcare through rigorous research and real-world validation." />
    <meta name="keywords" content="CRASH Lab, Ashoka University, Healthcare AI, Medical AI, Radiology AI, AI Research India, RadLE Benchmark, Responsible AI, KCDH-A, Koita Centre for Digital Health" />
    <meta name="author" content="Dr. Suvrankar Datta, CRASH Lab, Ashoka University" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://crashlab.in/" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crashlab.in/" />
    <meta property="og:title" content="CRASH Lab | Healthcare AI Research at Ashoka University" />
    <meta property="og:description" content="Centre for Responsible Autonomous Systems in Healthcare. Building ethical AI for Indian healthcare." />
    <meta property="og:site_name" content="CRASH Lab" />
    <meta property="og:image" content="https://crashlab.in/images/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CRASH Lab - Healthcare AI Research at Ashoka University" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRASH Lab | Healthcare AI Research" />
    <meta name="twitter:description" content="Centre for Responsible Autonomous Systems in Healthcare at Ashoka University." />
    <meta name="twitter:image" content="https://crashlab.in/images/social-preview.png" />
    
    <!-- Load Environment Variables -->
    <script src="/env.js"></script>
    
    <!-- Structured Data for Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ResearchOrganization",
      "name": "CRASH Lab",
      "alternateName": "Centre for Responsible Autonomous Systems in Healthcare",
      "url": "https://crashlab.in",
      "description": "Healthcare AI research lab at Ashoka University focused on building ethical, equitable AI for Indian healthcare.",
      "parentOrganization": {
        "@type": "CollegeOrUniversity",
        "name": "Ashoka University",
        "url": "https://www.ashoka.edu.in"
      },
      "foundingDate": "2024",
      "founder": {
        "@type": "Person",
        "name": "Dr. Suvrankar Datta",
        "jobTitle": "Group Lead"
      },
      "areaServed": "India",
      "keywords": ["Healthcare AI", "Medical Imaging", "Radiology AI", "Responsible AI", "RadLE Benchmark"]
    }
    </script>
    
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Space Grotesk', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              paper: '#FAFAF8',
              navy: {
                800: '#1e293b',
                900: '#0f172a',
              },
              brand: {
                blue: '#234C6A',
                light: '#456882',
                dark: '#1B3C53',
                muted: '#E3E3E3',
              },
              steel: {
                50: '#f0f4f7',
                100: '#dce5eb',
                200: '#b8cad7',
                300: '#8dafc3',
                400: '#5d8aa8',
                500: '#456882',
                600: '#375369',
                700: '#2a4054',
                800: '#1e2f3e',
                900: '#1B3C53',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Base Styles */
      body {
        background-color: #FAFAF8;
        color: #0f172a;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      
      /* Smooth scrolling */
      html {
        scroll-padding-top: 100px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom selection color */
      ::selection {
        background: #234C6A;
        color: white;
      }
      
      /* Typography - Headings */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: #0f172a;
      }
      
      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
      }
      
      h2 {
        font-size: clamp(2rem, 6vw, 3.5rem);
      }
      
      h3 {
        font-size: clamp(1.5rem, 4vw, 2.25rem);
      }
      
      h4 {
        font-size: clamp(1.25rem, 3vw, 1.5rem);
      }
      
      /* Body text */
      p {
        font-family: 'Inter', sans-serif;
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.7;
        color: #334155;
      }
      
      /* Display font settings (Space Grotesk) */
      .font-serif {
        font-family: 'Space Grotesk', sans-serif !important;
        letter-spacing: -0.02em;
      }
      
      /* Button Base Styles */
      button, .btn, a.btn {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.875rem;
        letter-spacing: 0.05em;
        transition: all 0.3s ease;
      }
      
      /* Primary Button */
      .btn-primary {
        background-color: #0f172a;
        color: white;
        padding: 1rem 2rem;
        border-radius: 9999px;
      }
      
      .btn-primary:hover {
        background-color: #234C6A;
      }
      
      /* Secondary Button */
      .btn-secondary {
        background-color: white;
        color: #0f172a;
        padding: 1rem 2rem;
        border-radius: 9999px;
        border: 1px solid #e2e8f0;
      }
      
      .btn-secondary:hover {
        background-color: #f8fafc;
      }
      
      /* Responsive Container */
      .container {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
      }
      
      /* Mobile-first responsive adjustments */
      @media (max-width: 640px) {
        body {
          font-size: 15px;
        }
        
        section {
          padding-top: 3rem;
          padding-bottom: 3rem;
        }
        
        .container {
          padding-left: 1rem;
          padding-right: 1rem;
        }
      }
      
      @media (min-width: 641px) and (max-width: 1024px) {
        body {
          font-size: 16px;
        }
        
        section {
          padding-top: 4rem;
          padding-bottom: 4rem;
        }
      }
      
      @media (min-width: 1025px) {
        body {
          font-size: 16px;
        }
        
        section {
          padding-top: 6rem;
          padding-bottom: 6rem;
        }
      }
      
      /* Ensure images are responsive */
      img {
        max-width: 100%;
        height: auto;
      }
      
      /* Responsive text utilities */
      .text-responsive-sm {
        font-size: clamp(0.75rem, 2vw, 0.875rem);
      }
      
      .text-responsive-base {
        font-size: clamp(0.875rem, 2.5vw, 1rem);
      }
      
      .text-responsive-lg {
        font-size: clamp(1rem, 3vw, 1.25rem);
      }
      
      .text-responsive-xl {
        font-size: clamp(1.25rem, 4vw, 1.5rem);
      }
      
      /* Hide custom cursor on touch devices */
      @media (pointer: coarse) {
        .custom-cursor {
          display: none !important;
        }
        * {
          cursor: auto !important;
        }
      }
    </style>
  </head>
  <body class="bg-paper text-navy-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
